name: Binaries

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            targets: "bun-darwin-arm64 bun-darwin-x64"
            smoke: octen-darwin-arm64
          - os: ubuntu-latest
            targets: "bun-linux-x64 bun-linux-arm64"
            smoke: octen-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build standalone binaries
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          mkdir -p dist-bin
          VERSION=$(node -p "require('./package.json').version")
          echo "version: $VERSION"
          for t in $TARGETS; do
            name="octen-${t#bun-}"
            echo "building $name ($t)"
            bun build ./src/cli.ts --compile --target="$t" \
              --define "__OCTEN_VERSION__=\"$VERSION\"" \
              --outfile "dist-bin/$name"
          done
          ls -la dist-bin
      - name: Smoke test the native binary
        env:
          SMOKE: ${{ matrix.smoke }}
        run: |
          chmod +x "dist-bin/$SMOKE"
          "./dist-bin/$SMOKE" --version
          "./dist-bin/$SMOKE" completion bash | head -1
      - name: Checksums
        env:
          OSNAME: ${{ matrix.os }}
        run: |
          cd dist-bin
          shasum -a 256 octen-* > "SHA256SUMS-$OSNAME.txt"
          cat "SHA256SUMS-$OSNAME.txt"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist-bin/*

  release-upload:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect binaries and checksums
        run: |
          mkdir -p dist-bin
          find artifacts -type f -name 'octen-*' -exec cp {} dist-bin/ \;
          cat artifacts/*/SHA256SUMS-*.txt > dist-bin/SHA256SUMS.txt
          echo "=== combined checksums ===" && cat dist-bin/SHA256SUMS.txt
          ls -la dist-bin
      - name: Create / update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Standalone binaries (no Node.js required). Also on npm: \`npm i -g @octen.ai/cli\`." \
            2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            dist-bin/octen-* dist-bin/SHA256SUMS.txt --clobber

      # The tap formula was updated by hand, so it lagged: it sat on 0.11.0
      # while npm and the binaries were already on 0.12.0, and nothing said
      # so. The checksums are in hand here, which is the only place they are
      # known without downloading the release back.
      #
      # Skips when the token is absent rather than failing: a release should
      # not break because the tap is not wired up yet.
      - name: Update the Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set — the tap still has to be updated by hand"
            exit 0
          fi
          VERSION="${TAG#v}"

          sha() { awk -v n="$1" '$2 == n { print $1 }' dist-bin/SHA256SUMS.txt; }
          for asset in octen-darwin-arm64 octen-darwin-x64 octen-linux-arm64 octen-linux-x64; do
            [ -n "$(sha "$asset")" ] || { echo "::error::no checksum for $asset"; exit 1; }
          done

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/Octen-Team/homebrew-tap.git" tap
          cd tap

          cat > Formula/octen.rb <<EOF
          class Octen < Formula
            desc "Octen CLI — web search, extract, chat, embeddings, and MCP/Skills setup"
            homepage "https://github.com/Octen-Team/octen-cli"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/Octen-Team/octen-cli/releases/download/v${VERSION}/octen-darwin-arm64"
                sha256 "$(sha octen-darwin-arm64)"
              end
              on_intel do
                url "https://github.com/Octen-Team/octen-cli/releases/download/v${VERSION}/octen-darwin-x64"
                sha256 "$(sha octen-darwin-x64)"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/Octen-Team/octen-cli/releases/download/v${VERSION}/octen-linux-arm64"
                sha256 "$(sha octen-linux-arm64)"
              end
              on_intel do
                url "https://github.com/Octen-Team/octen-cli/releases/download/v${VERSION}/octen-linux-x64"
                sha256 "$(sha octen-linux-x64)"
              end
            end

            def install
              bin.install Dir["octen-*"].first => "octen"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/octen --version")
            end
          end
          EOF

          if git diff --quiet; then
            echo "formula already at ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "octen ${VERSION}"
          git push -q origin HEAD:main
          echo "tap updated to ${VERSION}"
