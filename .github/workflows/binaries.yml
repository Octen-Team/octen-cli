name: Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to build and upload to, e.g. v0.13.0. The source is
          checked out at that tag; this workflow file comes from the branch the
          run is started on. Leave empty to build the branch without uploading.
        required: false
        default: ""
  push:
    tags: ["v*"]

# What a run builds and, for a release, where it uploads. A tag push builds
# the tag. A manual run with `tag` set builds that tag with the workflow from
# the branch it runs on — which is how a release is redone after a fix to this
# file, without moving the tag: moving it would re-run the npm publish for a
# version that is already published.
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Not a pinned image: GitHub retires them, and a retired one cancels
          # the job before it starts — v0.13.0 shipped no binaries that way.
          - os: macos-latest
            targets: "bun-darwin-arm64 bun-darwin-x64"
            smoke: octen-darwin-arm64
          - os: ubuntu-latest
            targets: "bun-linux-x64 bun-linux-arm64"
            smoke: octen-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build standalone binaries
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          mkdir -p dist-bin
          VERSION=$(node -p "require('./package.json').version")
          echo "version: $VERSION"
          # A binary reports the version it was built with, so a release must
          # be built from the commit whose package.json names it.
          if [ -n "$RELEASE_TAG" ] && [ "v$VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::package.json says $VERSION but the release tag is $RELEASE_TAG"
            exit 1
          fi
          for t in $TARGETS; do
            name="octen-${t#bun-}"
            echo "building $name ($t)"
            bun build ./src/cli.ts --compile --target="$t" \
              --define "__OCTEN_VERSION__=\"$VERSION\"" \
              --outfile "dist-bin/$name"
          done
          ls -la dist-bin
      - name: Smoke test the native binary
        env:
          SMOKE: ${{ matrix.smoke }}
        run: |
          chmod +x "dist-bin/$SMOKE"
          "./dist-bin/$SMOKE" --version
          "./dist-bin/$SMOKE" completion bash | head -1
      - name: Checksums
        env:
          OSNAME: ${{ matrix.os }}
        run: |
          cd dist-bin
          shasum -a 256 octen-* > "SHA256SUMS-$OSNAME.txt"
          cat "SHA256SUMS-$OSNAME.txt"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          if-no-files-found: error
          path: dist-bin/*

  release-upload:
    needs: build
    # The same condition as RELEASE_TAG above, spelled out: a job-level `if`
    # cannot read the `env` context. The event is checked first so that on a
    # tag push, where `inputs.tag` is null, it is never compared.
    if: (github.event_name == 'workflow_dispatch' && inputs.tag != '') || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect binaries and checksums
        run: |
          mkdir -p dist-bin
          find artifacts -type f -name 'octen-*' -exec cp {} dist-bin/ \;
          cat artifacts/*/SHA256SUMS-*.txt > dist-bin/SHA256SUMS.txt
          echo "=== combined checksums ===" && cat dist-bin/SHA256SUMS.txt
          ls -la dist-bin
      - name: Create / update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes "Standalone binaries (no Node.js required). Also on npm: \`npm i -g @octen.ai/cli\`." \
            2>/dev/null || true
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            dist-bin/octen-* dist-bin/SHA256SUMS.txt --clobber

      # The tap formula was updated by hand, so it lagged: it sat on 0.11.0
      # while npm and the binaries were already on 0.12.0, and nothing said
      # so. The checksums are in hand here, which is the only place they are
      # known without downloading the release back.
      #
      # Skips when the token is absent rather than failing: a release should
      # not break because the tap is not wired up yet.
      - name: Update the Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set — the tap still has to be updated by hand"
            exit 0
          fi
          VERSION="${TAG#v}"

          # Read every checksum into a variable before leaving this directory.
          # v0.13.0 wrote a formula with four empty sha256 values: the lookup
          # ran inside `$(...)` after `cd tap`, by a relative path that no
          # longer existed, and a failure inside `$(...)` does not stop
          # `set -e`. Values read up front, and checked, cannot go missing.
          sha() {
            local v
            v=$(awk -v n="$1" '$2 == n { print $1 }' dist-bin/SHA256SUMS.txt)
            [[ "$v" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no valid checksum for $1" >&2; return 1; }
            echo "$v"
          }
          SHA_DARWIN_ARM64=$(sha octen-darwin-arm64)
          SHA_DARWIN_X64=$(sha octen-darwin-x64)
          SHA_LINUX_ARM64=$(sha octen-linux-arm64)
          SHA_LINUX_X64=$(sha octen-linux-x64)

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/Octen-Team/homebrew-tap.git" tap
          cd tap

          cat > Formula/octen.rb <<EOF
          class Octen < Formula
            desc "Octen CLI — web search, extract, chat, embeddings, and MCP/Skills setup"
            homepage "https://github.com/Octen-Team/octen-cli"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/Octen-Team/octen-cli/releases/download/v${VERSION}/octen-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/Octen-Team/octen-cli/releases/download/v${VERSION}/octen-darwin-x64"
                sha256 "${SHA_DARWIN_X64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/Octen-Team/octen-cli/releases/download/v${VERSION}/octen-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/Octen-Team/octen-cli/releases/download/v${VERSION}/octen-linux-x64"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              bin.install Dir["octen-*"].first => "octen"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/octen --version")
            end
          end
          EOF

          # The same check the tap's own sync runs before it pushes: the
          # formula parses, and carries four distinct checksums.
          ruby -c Formula/octen.rb
          n=$(grep -oE 'sha256 "[0-9a-f]{64}"' Formula/octen.rb | sort -u | wc -l)
          if [ "$n" -ne 4 ]; then
            echo "::error::expected 4 distinct sha256 values in the formula, found $n"
            exit 1
          fi

          if git diff --quiet; then
            echo "formula already at ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "octen ${VERSION}"
          git push -q origin HEAD:main
          echo "tap updated to ${VERSION}"
